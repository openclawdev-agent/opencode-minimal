name: Build opencode-mini

permissions:
  contents: write

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode version tag'
        required: false
        default: 'v1.18.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone opencode
        run: |
          TAG="${{ github.event.inputs.opencode_version || 'v1.18.5' }}"
          git clone --depth 1 --branch "$TAG" \
            https://github.com/anomalyco/opencode.git _upstream

      - name: Install dependencies
        run: |
          cd _upstream
          bun install

      - name: Get version from source
        id: version
        run: |
          cd _upstream/packages/opencode
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build ARM64 binary
        run: |
          cd _upstream/packages/opencode
          bun build --compile --target=bun-linux-arm64-musl \
            --outfile=../../opencode-mini-arm64 \
            ./src/index.ts
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify binary
        run: |
          ls -lh opencode-mini-arm64
          file opencode-mini-arm64
          ./opencode-mini-arm64 --version || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mini
          path: opencode-mini-arm64

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: opencode-mini-arm64
          tag_name: 'v${{ steps.version.outputs.version }}'
          name: 'opencode-mini v${{ steps.version.outputs.version }}'
          generate_release_notes: true
