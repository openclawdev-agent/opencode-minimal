name: Build opencode-mini

permissions:
  contents: write

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode version tag'
        required: false
        default: 'v1.18.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone opencode
        run: |
          TAG="${{ github.event.inputs.opencode_version || 'v1.18.5' }}"
          git clone --depth 1 --branch "$TAG" \
            https://github.com/anomalyco/opencode.git _upstream

      - name: Strip non-essential packages
        run: |
          cd _upstream/packages
          echo "=== 移除不需要的包 ==="
          rm -rf tui ui app session-ui desktop web storybook enterprise function slack sdk-next
          rm -rf httpapi-codegen codemode cli http-recorder script storybook containers
          echo "=== 保留的包 ==="
          ls -d */

      - name: Patch opencode dependencies
        run: |
          cd _upstream/packages/opencode
          # 移除 TUI 相关依赖（serve 不需要）
          cat package.json | python3 -c "
          import json, sys
          pkg = json.load(sys.stdin)
          # 移除 TUI 相关依赖
          remove_deps = [
              '@opencode-ai/tui', '@opentui/core', '@opentui/keymap', '@opentui/solid',
              'solid-js', '@solid-primitives/event-bus', '@solid-primitives/scheduled',
              '@clack/prompts', 'opentui-spinner', '@kobalte/core',
              'tree-sitter-bash', 'tree-sitter-powershell', 'web-tree-sitter',
              '@silvia-odwyer/photon-node', '@zip.js/zip.js'
          ]
          for dep in remove_deps:
              pkg.get('dependencies', {}).pop(dep, None)
              pkg.get('devDependencies', {}).pop(dep, None)
          json.dump(pkg, sys.stdout, indent=2)
          " > package.json.tmp && mv package.json.tmp package.json
          echo "=== Patched dependencies ==="

      - name: Install dependencies
        run: |
          cd _upstream
          bun install --no-save

      - name: Build ARM64 binary
        run: |
          cd _upstream/packages/opencode
          bun build --compile --target=bun-linux-arm64-musl \
            --outfile=../../opencode-mini-arm64 \
            ./src/index.ts
        env:
          OPENCODE_VERSION: ${{ github.event.inputs.opencode_version || 'v1.18.5' }}

      - name: Verify binary
        run: |
          ls -lh opencode-mini-arm64
          file opencode-mini-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mini
          path: opencode-mini-arm64

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: opencode-mini-arm64
          generate_release_notes: true
