name: Build opencode

permissions:
  contents: write

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode version tag (e.g. v1.18.5)'
        required: false
        default: 'v1.18.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone opencode
        run: |
          TAG="${{ github.event.inputs.opencode_version || 'v1.18.5' }}"
          git clone --depth 1 --branch "$TAG" \
            https://github.com/anomalyco/opencode.git _upstream

      - name: Install dependencies
        run: |
          cd _upstream
          bun install

      - name: Build ARM64 binary
        run: |
          cd _upstream/packages/opencode
          bun run script/build.ts --single --skip-embed-web-ui
        env:
          GH_REPO: openclawdev-agent/opencode-minimal

      - name: Find and copy binary
        run: |
          cd _upstream/packages/opencode
          find dist -type f -name "opencode" | head -5
          # 复制到根目录
          cp dist/*/bin/opencode ../../opencode-arm64 || true
          ls -lh ../../opencode-arm64 2>/dev/null || echo "binary not found"

      - name: Report sizes
        run: |
          echo "=== 构建产物体积 ==="
          ls -lh opencode-arm64 2>/dev/null || echo "无产物"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-arm64
          path: opencode-arm64

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: opencode-arm64
          generate_release_notes: true
