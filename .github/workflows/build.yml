name: Build opencode-mini

permissions:
  contents: write

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode version tag'
        required: false
        default: 'v1.18.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone opencode
        run: |
          TAG="${{ github.event.inputs.opencode_version || 'v1.18.5' }}"
          git clone --depth 1 --branch "$TAG" \
            https://github.com/anomalyco/opencode.git _upstream

      - name: Get version from source
        id: version
        run: |
          VERSION=$(cd _upstream/packages/opencode && python3 -c "import json; print(json.load(open('package.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Strip non-essential packages
        run: |
          cd _upstream/packages
          echo "=== 移除不需要的包 ==="
          # 只移除 TUI/Desktop/企业版等，保留 Web UI
          rm -rf tui desktop web storybook enterprise function slack sdk-next
          rm -rf httpapi-codegen codemode cli http-recorder script containers
          echo "=== 保留的包（含 Web UI）==="
          ls -d */

      - name: Patch root package.json
        run: |
          cd _upstream
          cat package.json | python3 -c "
          import json, sys
          pkg = json.load(sys.stdin)
          remove = {'@opencode-ai/script', '@opencode-ai/slack', '@opencode-ai/sdk-next'}
          # 移除 workspaces 中的引用
          ws = pkg.get('workspaces', {})
          if isinstance(ws, dict) and 'packages' in ws:
              ws['packages'] = [w for w in ws['packages'] if w not in remove]
          elif isinstance(ws, list):
              pkg['workspaces'] = [w for w in ws if w not in remove]
          # 移除 dependencies 中的 workspace 引用
          deps = pkg.get('dependencies', {})
          to_del = [k for k in deps if k in remove]
          for k in to_del:
              del deps[k]
          json.dump(pkg, sys.stdout, indent=2)
          " > package.json.tmp && mv package.json.tmp package.json
          echo "=== Patched root package.json ==="

      - name: Remove deleted workspace references
        run: |
          cd _upstream
          # 要移除的包
          REMOVE='@opencode-ai/script @opencode-ai/httpapi-codegen @opencode-ai/http-recorder @opencode-ai/codemode @opencode-ai/tui @opencode-ai/slack @opencode-ai/sdk-next @opencode-ai/cli @opencode-ai/storybook @opencode-ai/enterprise @opencode-ai/function @opencode-ai/containers'
          for pkg in $(find packages -name package.json); do
            python3 -c "
          import json, sys
          remove = set('''$REMOVE'''.split())
          pkg = json.load(open('$pkg'))
          changed = False
          for section in ['dependencies', 'devDependencies', 'peerDependencies']:
              deps = pkg.get(section, {})
              to_del = [k for k in deps if k in remove]
              for k in to_del:
                  del deps[k]
                  changed = True
          if changed:
              json.dump(pkg, open('$pkg', 'w'), indent=2)
              print(f'Patched: $pkg')
          "
          done

      - name: Patch opencode dependencies
        run: |
          cd _upstream/packages/opencode
          # 仅移除 TUI 特有依赖（保留 solid-js 给 Web UI）
          cat package.json | python3 -c "
          import json, sys
          pkg = json.load(sys.stdin)
          # 只移除 TUI 特有依赖
          remove_deps = [
              '@opencode-ai/tui', '@opentui/core', '@opentui/keymap', '@opentui/solid',
              '@clack/prompts', 'opentui-spinner',
              'tree-sitter-bash', 'tree-sitter-powershell', 'web-tree-sitter',
              '@silvia-odwyer/photon-node', '@zip.js/zip.js'
          ]
          for dep in remove_deps:
              pkg.get('dependencies', {}).pop(dep, None)
              pkg.get('devDependencies', {}).pop(dep, None)
          json.dump(pkg, sys.stdout, indent=2)
          " > package.json.tmp && mv package.json.tmp package.json
          echo "=== Patched dependencies (TUI only removed) ==="

      - name: Install dependencies
        run: |
          cd _upstream
          bun install --no-save

      - name: Build ARM64 binary
        run: |
          cd _upstream/packages/opencode
          bun build --compile --target=bun-linux-arm64-musl \
            --outfile=../../opencode-mini-arm64 \
            ./src/index.ts
        env:
          OPENCODE_VERSION: ${{ github.event.inputs.opencode_version || 'v1.18.5' }}

      - name: Verify binary
        run: |
          ls -lh opencode-mini-arm64
          file opencode-mini-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mini
          path: opencode-mini-arm64

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: opencode-mini-arm64
          tag_name: 'v${{ steps.version.outputs.version }}'
          name: 'opencode-mini v${{ steps.version.outputs.version }}'
          generate_release_notes: true
