name: Build opencode-minimal

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode 版本 tag'
        required: false
        default: 'v0.0.55'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Clone opencode
        run: |
          TAG="${{ github.event.inputs.opencode_version || 'v0.0.55' }}"
          git clone --depth 1 --branch "$TAG" \
            https://github.com/opencode-ai/opencode.git _upstream

      - name: Strip non-essential modules
        run: |
          cd _upstream
          echo "=== 移除非必要模块 ==="
          rm -rf internal/tui
          rm -rf internal/completions
          rm -rf internal/lsp

          echo "=== 创建 tui stub ==="
          mkdir -p internal/tui/theme
          printf '%s\n' 'package tui

import (
	tea "github.com/charmbracelet/bubbletea"
	"github.com/opencode-ai/opencode/internal/app"
)

type stubModel struct{}

func (m stubModel) Init() tea.Cmd            { return nil }
func (m stubModel) Update(tea.Msg) (tea.Model, tea.Cmd) { return m, nil }
func (m stubModel) View() string             { return "" }

func New(_ *app.App) tea.Model { return stubModel{} }' > internal/tui/tui.go
          printf '%s\n' 'package theme

type Theme struct{}

func (Theme) Get() Theme       { return Theme{} }
func Init(_ string)            {}
func SetTheme(_ string) error  { return nil }' > internal/tui/theme/theme.go

          echo "=== 创建 lsp stub ==="
          mkdir -p internal/lsp/protocol internal/lsp/watcher
          printf '%s\n' 'package lsp

import (
	"context"
	"encoding/json"
	"sync"

	"github.com/opencode-ai/opencode/internal/lsp/protocol"
)

type ServerState int

const (
	StateStarting ServerState = iota
	StateReady
	StateError
)

type NotificationHandler func(json.RawMessage)

type Client struct {
	notificationHandlers map[string]NotificationHandler
	notificationMu       sync.RWMutex
	diagnostics          map[protocol.DocumentUri][]protocol.Diagnostic
	diagnosticsMu        sync.RWMutex
	serverState          ServerState
}

func NewClient(ctx context.Context, command string, args ...string) (*Client, error) {
	return &Client{
		notificationHandlers: make(map[string]NotificationHandler),
		diagnostics:          make(map[protocol.DocumentUri][]protocol.Diagnostic),
	}, nil
}

func (c *Client) InitializeLSPClient(ctx context.Context, workspaceDir string) (*protocol.InitializeResult, error) {
	return nil, nil
}

func (c *Client) Close() error                              { return nil }
func (c *Client) Shutdown(ctx context.Context) error         { return nil }
func (c *Client) WaitForServerReady(ctx context.Context) error { return nil }
func (c *Client) GetServerState() ServerState               { return c.serverState }
func (c *Client) SetServerState(state ServerState)          { c.serverState = state }
func (c *Client) OpenFile(ctx context.Context, filepath string) error    { return nil }
func (c *Client) NotifyChange(ctx context.Context, filepath string) error { return nil }
func (c *Client) IsFileOpen(filepath string) bool              { return false }

func (c *Client) GetDiagnostics() map[protocol.DocumentUri][]protocol.Diagnostic {
	c.diagnosticsMu.RLock()
	defer c.diagnosticsMu.RUnlock()
	return c.diagnostics
}

func (c *Client) RegisterNotificationHandler(method string, handler NotificationHandler) {
	c.notificationMu.Lock()
	defer c.notificationMu.Unlock()
	c.notificationHandlers[method] = handler
}

func HandleDiagnostics(client *Client, params json.RawMessage) {}

type LSPClients = map[string]*Client' > internal/lsp/lsp.go
          printf '%s\n' 'package protocol

type DocumentUri string

func (uri DocumentUri) Path() string { return string(uri) }

type URI = string

type DiagnosticSeverity uint32

const (
	SeverityError       DiagnosticSeverity = 1
	SeverityWarning     DiagnosticSeverity = 2
	SeverityInformation DiagnosticSeverity = 3
	SeverityHint        DiagnosticSeverity = 4
)

type DiagnosticTag uint32

const (
	Unnecessary DiagnosticTag = 1
	Deprecated  DiagnosticTag = 2
)

type Position struct {
	Line      uint32 `json:"line"`
	Character uint32 `json:"character"`
}

type Range struct {
	Start Position `json:"start"`
	End   Position `json:"end"`
}

type Diagnostic struct {
	Range    Range              `json:"range"`
	Severity DiagnosticSeverity `json:"severity,omitempty"`
	Code     interface{}        `json:"code,omitempty"`
	Source   string             `json:"source,omitempty"`
	Message  string             `json:"message"`
	Tags     []DiagnosticTag    `json:"tags,omitempty"`
}

type PublishDiagnosticsParams struct {
	URI         DocumentUri  `json:"uri"`
	Version     int32        `json:"version,omitempty"`
	Diagnostics []Diagnostic `json:"diagnostics"`
}

type InitializeResult struct{}' > internal/lsp/protocol/protocol.go
