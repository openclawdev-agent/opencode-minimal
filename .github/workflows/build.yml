name: Build opencode-minimal

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode 版本 tag'
        required: false
        default: 'v0.0.55'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Clone opencode
        run: |
          TAG="${{ github.event.inputs.opencode_version || 'v0.0.55' }}"
          git clone --depth 1 --branch "$TAG" \
            https://github.com/opencode-ai/opencode.git _upstream

      - name: Strip non-essential modules
        run: |
          cd _upstream
          echo "=== 移除非必要模块 ==="
          rm -rf internal/tui internal/completions internal/lsp
          echo "=== 从 stubs 目录复制精简实现 ==="
          mkdir -p internal/tui/theme internal/lsp/protocol internal/lsp/watcher
          cp $GITHUB_WORKSPACE/stubs/tui.go internal/tui/tui.go
          cp $GITHUB_WORKSPACE/stubs/theme.go internal/tui/theme/theme.go
          cp $GITHUB_WORKSPACE/stubs/lsp.go internal/lsp/lsp.go
          cp $GITHUB_WORKSPACE/stubs/protocol.go internal/lsp/protocol/protocol.go
          cp $GITHUB_WORKSPACE/stubs/watcher.go internal/lsp/watcher/watcher.go
          echo "=== 模块列表 ==="
          ls internal/

      - name: Build ARM64 binary
        run: |
          cd _upstream
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o ../opencode.minimal-arm64 . || {
              echo "TUI 移除构建失败，回退到纯构建优化"
              git checkout -- .
              rm -rf internal/tui internal/completions internal/lsp
              mkdir -p internal/tui/theme internal/lsp/protocol internal/lsp/watcher
              cp $GITHUB_WORKSPACE/stubs/tui.go internal/tui/tui.go
              cp $GITHUB_WORKSPACE/stubs/theme.go internal/tui/theme/theme.go
              cp $GITHUB_WORKSPACE/stubs/lsp.go internal/lsp/lsp.go
              cp $GITHUB_WORKSPACE/stubs/protocol.go internal/lsp/protocol/protocol.go
              cp $GITHUB_WORKSPACE/stubs/watcher.go internal/lsp/watcher/watcher.go
              CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
                go build -trimpath -ldflags="-s -w" \
                -o ../opencode.minimal-arm64 .
            }

      - name: Build AMD64 binary
        run: |
          cd _upstream
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o ../opencode.minimal-amd64 . || true

      - name: Report sizes
        run: |
          echo "=== 构建产物体积 ==="
          ls -lh opencode.minimal-* 2>/dev/null || echo "无产物"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-minimal
          path: opencode.minimal-*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: opencode.minimal-*
          generate_release_notes: true
